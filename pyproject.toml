[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalshift"
version = "1.2.1"
description = "Run your prompts on two LLMs and find out, with statistical confidence, what regressed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lukas Babaliauskas" }]
keywords = ["llm", "evaluation", "regression-testing", "anthropic", "openai", "gemini", "deepseek", "migration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The capture SDK (import name `evalshift`). Stdlib-only, so it adds nothing to
    # the environment; declared so one `pip install evalshift` serves both
    # instrumenting an agent and running evaluations, and so `import evalshift` is
    # always the SDK. See the co-install note in DOCS.md.
    "evalshift-sdk>=0.4.0",
    "typer>=0.12",
    "pydantic>=2.5",
    "httpx>=0.27",
    "litellm>=1.77,<2",
    "rich>=13.7",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",  # required by SQLAlchemy's async API
    "pyyaml>=6.0",
    "packaging>=23",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
    "pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Pinned exactly: ruff's formatter and rule set change between minor
    # releases, so a floating version makes CI fail on code that was clean
    # when it was written. Bump deliberately, with the reformat in the same
    # commit.
    "ruff==0.16.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/evalshift/evalshift-cli"
Documentation = "https://github.com/evalshift/evalshift-cli#readme"
Repository = "https://github.com/evalshift/evalshift-cli"
Issues = "https://github.com/evalshift/evalshift-cli/issues"
Changelog = "https://github.com/evalshift/evalshift-cli/blob/main/CHANGELOG.md"

[project.scripts]
evalshift = "evalshift_cli.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evalshift_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/evalshift_cli",
    "tests",
    "examples",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CLAUDE.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=evalshift_cli",
    "--cov-report=term-missing",
]
markers = [
    "integration: integration tests (mocked LLM providers)",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
branch = true
source = ["evalshift_cli"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
